# =====================================================================
#  parakeet_realtime (120M) Arm A — ONNX / onnxruntime deploy config
#
#  Runtime knobs ONLY. Everything that describes the MODEL (streaming geometry,
#  cache shapes, blank id, preprocessor params) lives in weights/streaming_meta.json,
#  written by scripts/export_parakeet_onnx.py from the checkpoint itself — so the
#  wrapper can never drift from the graph it is running.
#
#  Edit values here; do NOT edit model.py.
# =====================================================================

runtime:
  # Intra-op threads PER PROCESS. The eval worker is 24 vCPU / 226 GiB and the
  # organizers' accuracy pass runs ~20 worker processes on it, so threads multiply
  # by 20. Measured under that exact topology (exp_nemotron_speed_002): threads=1 was
  # 4.2x faster wall-clock than threads=4 with byte-identical transcripts. Wall clock
  # is the 15000 s budget. The cgroup quota is a CEILING on top of this, never the
  # target. Override per-run with SAPC2_THREADS (env wins).
  # >>> VERIFY-ON-POD <<< sweep 1/2/4 on the STREAMING pass: if per-chunk compute at
  # 1 thread exceeds 100 ms the stream falls behind real time and TTFT/TTLT regress.
  num_threads: 1

encoder:
  # MEASURED on-pod 2026-07-29 (scripts/probe_parakeet_enc.py, Arm A export, 16 steps):
  # the exported graph applies BOTH `drop_extra_pre_encoded` and `valid_out_len` itself —
  # every later step returned exactly NeMo's post-drop frame count with max|Δ| ~1e-6. So
  # the wrapper must NOT redo either trim; doing so silently deletes real encoder frames.
  #   nemo — redo the trim in the wrapper (correct only if the graph does not)
  #   none — trust the graph  <-- what this export requires
  drop_policy: none
  trim_policy: none

  # Step 0 has no prior frames, but the graph's drop is unconditional, so feeding NeMo's
  # 9-frame first step underflows to a zero-length sequence (ORT: "Conv ... Invalid input
  # shape: {0}"). Step 0 therefore carries a full-width pre-encode cache of ZEROS — the
  # same convention the Nemotron submission that scored used.
  #   zeros — pad the step-0 pre-encode cache to full width  <-- required
  #   nemo  — empty step-0 cache (reproduces the failure; kept for probing only)
  first_step_pad: zeros

decoding:
  # Greedy RNN-T (the low-latency path; matches the banked Arm A measurement).
  # max_symbols_per_step guards the non-blank loop, as in NeMo's greedy decoder.
  # null = use the checkpoint's own value (exported into weights/streaming_meta.json).
  # Set a number here only to override it deliberately; env SAPC2_MAX_SYMBOLS wins over both.
  max_symbols_per_step: null

  # Constant subtracted from the BLANK logit before the greedy argmax. 0.0 = the decode
  # path of the submission that scored Test1 CER 19.01%, unchanged.
  # Rationale and sweep protocol: investigations/step01_runbook.md. The official error
  # profile is deletion-dominated (del:ins ~18:1), so the joint over-emits blank; this is
  # the counter-pressure, and it is the only knob greedy argmax can see (a temperature
  # cancels out of an argmax). Raising it trades insertions for deletions and emits
  # earlier, so it moves CER AND TTFT — re-measure both, never assume.
  # Do not ship a non-zero value that has not been through evaluate.sh on two Dev slices.
  # Env SAPC2_BLANK_PENALTY overrides.
  blank_penalty: 0.0

  # --- RNN-T beam search -------------------------------------------------------
  # 1 = greedy = the decode path of the submission that scored Test1 CER 19.01%,
  # byte-identical (beam=1 never constructs a hypothesis object).
  #
  # Motivation, from the official decomposition (exp_s0_s1_probe, Dev_diag n=425):
  # 3780 of 5430 char errors are deletions, and 3780 char-deletions / 760 word-deletions
  # = 4.97 chars each against a 4.91-char mean reference word. The model omits ~13% of
  # reference words WHOLE; the words it does emit are ~2 chars off. That is a coverage
  # failure, not a phonetic one. Greedy takes blank at a frame and can never revisit it.
  # A beam keeps the emitting continuation alive so later frames can pay for it.
  #
  # COSTS LATENCY AND WALL CLOCK. Up to (beam_max_symbols + 1) * beam decoder runs per
  # encoder frame. The encoder is untouched, so the multiplier on end-to-end time is far
  # below `beam`, but TTFT/TTLT and the 15000 s budget are both scored: measure both
  # passes, never ship a beam value on an accuracy number alone.
  beam: 1

  # Max token emissions per encoder frame inside the beam (greedy's own guard is
  # max_symbols_per_step above; this one is separate because the beam pays `beam` decoder
  # runs per depth). 1 is the cheap setting and is likely sufficient on slow dysarthric
  # speech; 2 is the safe default.
  beam_max_symbols: 2

  # Non-blank continuations considered per hypothesis per depth. 0 = use `beam`. Widening
  # costs no extra decoder runs (one run returns the whole vocab row) — it only enlarges
  # the pool the top-`beam` prune selects from.
  beam_expand: 0

  # Drop candidates more than this far below the best in the same pool (log-prob units).
  beam_prune_logp: -12.0

  # Final ranking only. RNN-T beams are biased toward SHORT output because each extra
  # token multiplies in another probability < 1 — which is precisely our failure mode, so
  # this is on-target and must be swept rather than assumed.
  #   none — raw path log-prob
  #   mean — path log-prob / number of emitted tokens
  beam_length_norm: none

output:
  # parakeet_realtime emits <EOU>; research/46 saw it on 100/123 sweep hyps. Strip
  # special tokens in the wrapper — NEVER in the scorer (house rule), and never emit
  # one to sclite (cf. the `unk` assertion that fails a whole submission).
  strip_special_tokens: true
  special_token_pattern: "<[^>]+>"

input_gain:
  # Causal frozen-scalar input gain. SHIPS OFF: falsified against the severe empties —
  # 40/48 of them have a near-silent onset (<-45 dBFS) so the frozen gain floors to 1.0
  # and 0/48 recovered through the real harness; official Dev_diag severe was also worse
  # with it on (19.22% vs 18.69%). Kept purely so the banked A/B is reproducible on a pod
  # without a code edit. Env overrides: SAPC2_INPUT_GAIN / SAPC2_TARGET_DBFS /
  # SAPC2_GAIN_CAP_DB / SAPC2_RMS_FLOOR_DBFS.
  enabled: false
  target_dbfs: -25.0
  cap_db: 20.0
  floor_dbfs: -45.0
